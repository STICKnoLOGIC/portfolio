name: Case Study Indexer
on:
  workflow_dispatch:
    
  push:
    branches:
      - 'data'
    paths:
      - 'content/case-study/*.md'

jobs:
  modify-files:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          ref: data
          fetch-depth: 1
      
      - name: Install yq
        run: |
          sudo wget https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64 -O /usr/bin/yq
          sudo chmod +x /usr/bin/yq

      - name: Generate index file
        run: |
          cd content/case-study
          echo "[" > index.json
          first=true
          
          # Find all .md files. Adjust 'docs/' if your files are in a specific folder.
          for file in $(find . -name "*.md" -not -path "./node_modules/*"); do
            # Extract front matter using yq. 
            # --front-matter=extract isolates the YAML block.
            # -o=json converts it to JSON.
            json_block=$(yq --front-matter=extract -o=json "$file")
            
            # Add comma separator if not the first item
            if [ "$first" = true ]; then
              first=false
            else
              echo "," >> index.json
            fi
            
            # Append the JSON block
            echo "$json_block" >> index.json
          done
          
          echo "]" >> index.json
          
          # Optional: Pretty print the final JSON
          cat index.json | jq '.' > temp.json && mv temp.json index.json
          
      - name: Generate slug file
        run: |
          cd content/case-study
           # Initialize an empty Bash array to hold JSON objects
          json_entries=()

          # Find all .md files safely (handles spaces in filenames)
          while IFS= read -r -d '' file; do
            # Skip the output file itself
            if [[ "$file" == "./slugs.json" ]]; then continue; fi
            if [[ "$file" == "./index.json" ]]; then continue; fi

            # Extract slug using yq with RAW output (-r) to avoid extra quotes
            slug=$(yq --front-matter=extract -r '.slug' "$file" 2>/dev/null)

            # Get filename without extension
            filename=$(basename "$file" .md)

            # Fallback: If slug is empty or "null", use filename
            if [ -z "$slug" ] || [ "$slug" == "null" ]; then
              slug="$filename"
            fi

            # Create a valid JSON key-value pair using jq
            # This handles all escaping (quotes, special chars) automatically
            # {($slug): $filename} creates a dynamic key
            entry=$(jq -n --arg s "$slug" --arg f "$filename" '{($s): $f}')
            
            # Add to array
            json_entries+=("$entry")
          done < <(find . -name "*.md" -not -path "./node_modules/*" -not -path "./.git/*" -print0)

          # Combine all entries into a single JSON object
          # 'jq -s' slurps all inputs into an array, 'add' merges them into one object
          printf '%s\n' "${json_entries[@]}" | jq -s 'add' > slugs.json

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          cd content/case-study
          git add index.json slugs.json
          git commit -m "[BOT] Indexed files"
          # Use github.ref_name to push to the branch that triggered the action
          git push origin data