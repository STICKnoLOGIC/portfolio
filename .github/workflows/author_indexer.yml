name: Author Indexer
on:
  workflow_dispatch:
    
  push:
    branches:
      - 'data'
    paths:
      - 'content/author/*.md'

jobs:
  modify-files:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          ref: data
          fetch-depth: 1
      
      - name: Generate index file
        run: |
          cd content/author
          echo "[" > index.json
          first=true
          
          # Find all .md files. Adjust 'docs/' if your files are in a specific folder.
          for file in $(find . -name "*.md" -not -path "./node_modules/*"); do

            filename=$(basename "$file" .md)
            
            # Add comma separator if not the first item
            if [ "$first" = true ]; then
              first=false
            else
              echo "," >> index.json
            fi
            
            # Append the JSON block
            echo "\"$filename\"" >> index.json
          done
          
          echo "]" >> index.json
          
          # Optional: Pretty print the final JSON
          cat index.json | jq '.' > temp.json && mv temp.json index.json
        
      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          cd content/author
          git add index.json
          git commit -m "[BOT] Indexed files"
          # Use github.ref_name to push to the branch that triggered the action
          git push origin data